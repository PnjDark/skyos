[package]
name = "models"
version = "0.1.0"
edition = "2024"

[dependencies]
tools = { path = "../tools" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
ureq = { version = "3", default-features = false, features = ["json"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
