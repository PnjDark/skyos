[package]
name = "skyos-transform"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel = { path = "../kernel" }
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.3"
