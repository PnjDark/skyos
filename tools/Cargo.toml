[package]
name = "tools"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel = { path = "../kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
tokio = { version = "1.0", features = ["full", "process"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.3"
