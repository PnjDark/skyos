[package]
name = "sky-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "sky"
path = "src/main.rs"

[dependencies]
kernel = { path = "../../kernel" }
tools = { path = "../../tools" }
skyos-provisioner = { path = "../../provisioner" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.36", features = ["bundled"] }
tempfile = "3.3"

# Platform-native process identity lives strictly in the host crate; the kernel
# stays platform-agnostic.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
