[package]
name = "sky-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "sky"
path = "src/main.rs"

[dependencies]
kernel = { path = "../../kernel" }
tools = { path = "../../tools" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
sha2 = "0.10"
