[package]
name = "skyos-crash-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 5.3 crash-injection worker: real processes, real SQLite WAL, real Git side effects."

[[bin]]
name = "sky-crash-worker"
path = "src/main.rs"

[dependencies]
kernel = { path = "../kernel" }
tools = { path = "../tools" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
