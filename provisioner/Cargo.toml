[package]
name = "skyos-provisioner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
tracing = "0.1"
dunce = "1.0" # Safe canonicalization across Windows & Unix

[dev-dependencies]
tempfile = "3.3"
